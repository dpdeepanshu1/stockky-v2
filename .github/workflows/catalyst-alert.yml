# Pre-market (07:30 & 08:15 IST) + intraday catalyst sweeps → Telegram
# Uses async /catalysts/alert (returns immediately) + status poll to avoid 180s curl timeout.
name: Stockky Catalyst Alert

on:
  schedule:
    - cron: "0 2 * * 1-5"
    - cron: "45 2 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      notify:
        description: "Send Telegram"
        required: false
        default: true
        type: boolean

jobs:
  catalyst:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: IST context
        run: |
          echo "IST now: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"
          DOW=$(TZ=Asia/Kolkata date +%u)
          if [ "$DOW" -gt 5 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Weekend — skip"
            exit 0
          fi

      - name: Wake gateway + run catalyst alert (async + poll)
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          set -e
          GW="${API_GATEWAY_URL%/}"
          if [ -z "$GW" ]; then
            echo "API_GATEWAY_URL secret not set"
            exit 1
          fi

          # Aggressive warm for free-tier
          curl -fsS -m 45 -X POST "$GW/wake-all" || curl -fsS -m 45 "$GW/wake-all" || true
          curl -fsS -m 30 "$GW/health?warm=true" || curl -fsS -m 25 "$GW/health" || true
          curl -fsS -m 15 "$GW/ops/keepalive" || true
          sleep 20

          NOTIFY=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOTIFY="${{ inputs.notify }}"
          fi

          echo "Starting async catalyst job…"
          # Short timeout on start — endpoint returns immediately now
          START=$(curl -fsS -m 45 -X POST "$GW/catalysts/alert?force=true&notify=$NOTIFY" || echo '{}')
          echo "$START" | head -c 400; echo

          # Poll up to ~18 minutes (hot scan can be long on free tier)
          for i in $(seq 1 72); do
            sleep 15
            ST=$(curl -fsS -m 20 "$GW/catalysts/alert/status" || echo '{}')
            echo "[$i] $ST" | head -c 280; echo
            echo "$ST" | grep -q '"status":"done"' && { echo "Catalyst done"; exit 0; }
            echo "$ST" | grep -q '"status":"error"' && { echo "Catalyst error"; exit 1; }
          done
          echo "Timed out waiting for catalyst job"
          exit 1
