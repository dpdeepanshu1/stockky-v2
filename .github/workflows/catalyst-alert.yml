# Full-universe catalyst alert in batches + keep-warm between polls
name: Stockky Catalyst Alert

on:
  schedule:
    - cron: "0 2 * * 1-5"
    - cron: "45 2 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      notify:
        description: "Send Telegram"
        required: false
        default: true
        type: boolean

jobs:
  catalyst:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: IST context
        run: |
          echo "IST now: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"
          DOW=$(TZ=Asia/Kolkata date +%u)
          if [ "$DOW" -gt 5 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Weekend — skip"
            exit 0
          fi

      - name: Full-universe catalyst (batched) + keep-warm poll
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          [ -n "$GW" ] || { echo "API_GATEWAY_URL missing"; exit 1; }

          warm() {
            curl -sS -m 25 -X POST "$GW/wake-all" >/dev/null 2>&1 || true
            curl -sS -m 20 "$GW/health?warm=true" >/dev/null 2>&1 || true
            curl -sS -m 12 "$GW/ops/keepalive" >/dev/null 2>&1 || true
          }

          echo "=== Warm ==="
          warm; sleep 10; warm; sleep 8

          NOTIFY=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOTIFY="${{ inputs.notify }}"
          fi

          # Full universe — batch_size only controls chunking, not stock count
          echo "=== Start full catalyst (batch_size=25) ==="
          START=$(curl -sS -m 60 -X POST "$GW/catalysts/alert?force=true&notify=$NOTIFY&batch_size=25" 2>/dev/null || echo '{}')
          echo "$START" | head -c 500; echo

          LAST=""
          STUCK=0
          # ~40 min poll window for full universe in batches
          for i in $(seq 1 120); do
            sleep 15
            if [ $((i % 2)) -eq 0 ]; then
              warm
            fi
            ST=$(curl -sS -m 50 "$GW/catalysts/alert/status" 2>/dev/null || echo '{}')
            echo "[$i] $ST" | head -c 360; echo

            echo "$ST" | grep -q '"status":"done"' && { echo "Catalyst done (all batches)"; exit 0; }
            if echo "$ST" | grep -q '"status":"error"'; then
              echo "Error — force restart once to continue"
              warm; sleep 10
              curl -sS -m 60 -X POST "$GW/catalysts/alert?force=true&notify=$NOTIFY&batch_size=25" >/dev/null 2>&1 || true
              STUCK=$((STUCK + 1))
              [ "$STUCK" -ge 3 ] && { echo "Too many errors"; exit 1; }
              continue
            fi

            MSG=$(echo "$ST" | tr -d '\n')
            if [ "$MSG" = "$LAST" ] && echo "$ST" | grep -q '"status":"running"'; then
              STUCK=$((STUCK + 1))
            else
              STUCK=0
            fi
            LAST="$MSG"
            # frozen ~2 min → warm + soft nudge (force restart)
            if [ "$STUCK" -ge 8 ]; then
              echo "Stuck — warm + force restart (full universe again)"
              warm; sleep 8
              curl -sS -m 60 -X POST "$GW/catalysts/alert?force=true&notify=$NOTIFY&batch_size=20" >/dev/null 2>&1 || true
              STUCK=0
              LAST=""
            fi
          done
          echo "Timed out waiting for all batches"
          exit 1
