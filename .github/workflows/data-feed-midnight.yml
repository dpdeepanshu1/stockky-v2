name: Stockky Data Feed (Midnight IST)

on:
  schedule:
    - cron: "45 18 * * 0-4"
  workflow_dispatch:

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: IST check
        run: echo "IST $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"

      - name: Batched data feed + keep-warm between polls
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          ANALYSIS_URL: ${{ secrets.ANALYSIS_INTELLIGENCE_URL }}
          DECISION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          [ -n "$GW" ] || { echo "API_GATEWAY_URL missing"; exit 1; }

          warm() {
            curl -sS -m 30 -X POST "$GW/wake-all" >/dev/null 2>&1 || true
            curl -sS -m 20 "$GW/health?warm=true" >/dev/null 2>&1 || true
            curl -sS -m 12 "$GW/ops/keepalive" >/dev/null 2>&1 || true
            for U in "$MARKET_DATA_URL" "$ANALYSIS_URL" "$DECISION_URL"; do
              [ -z "$U" ] && continue
              curl -sS -m 15 "${U%/}/health?warm=true" >/dev/null 2>&1 || true
            done
          }

          warm; sleep 15; warm; sleep 10
          curl -sS -m 45 -X POST "$GW/data-feed/run?force=true" || true

          for i in $(seq 1 200); do
            sleep 20
            if [ $((i % 2)) -eq 0 ]; then
              warm
            fi
            ST=$(curl -sS -m 45 "$GW/data-feed/status" 2>/dev/null || echo '{}')
            echo "[$i] $ST" | head -c 360; echo
            echo "$ST" | grep -q '"status":"done"' && { echo "All batches fed"; exit 0; }
            echo "$ST" | grep -q '"status":"stopped"' && { echo "Stopped partial — checkpoint saved"; exit 0; }
            echo "$ST" | grep -q '"status":"error"' && { echo "Error"; exit 1; }
          done
          echo "Timeout — checkpoint remains for Resume"
          exit 1
