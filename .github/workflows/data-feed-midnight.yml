# Midnight Data Feed Batcher (IST)
# GitHub Actions owns the long loop; Render only handles short batches
# so we never hit Render's ~100-minute HTTP hard timeout or free-tier spin-down.
name: Midnight Data Feed Batcher

on:
  schedule:
    # 00:15 IST ≈ 18:45 UTC (Mon–Fri)
    - cron: "45 18 * * 0-4"
  workflow_dispatch:

jobs:
  update_feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: IST timestamp
        run: echo "IST $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"

      - name: Wake & warm Render services
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          ANALYSIS_URL: ${{ secrets.ANALYSIS_INTELLIGENCE_URL }}
          DECISION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          [ -n "$GW" ] || { echo "API_GATEWAY_URL secret missing"; exit 1; }

          warm() {
            echo "Warm ping…"
            curl -sS -m 30 -X POST "$GW/wake-all" >/dev/null 2>&1 || true
            curl -sS -m 20 "$GW/health?warm=true" >/dev/null 2>&1 || true
            curl -sS -m 12 "$GW/ops/keepalive" >/dev/null 2>&1 || true
            for U in "$MARKET_DATA_URL" "$ANALYSIS_URL" "$DECISION_URL"; do
              [ -z "$U" ] && continue
              curl -sS -m 15 "${U%/}/health?warm=true" >/dev/null 2>&1 || true
            done
          }

          warm
          sleep 15
          warm
          sleep 10
          echo "Services warmed"

      - name: Process universe in small batches
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          set -euo pipefail
          GW="${API_GATEWAY_URL%/}"
          BATCH_SIZE="${FEED_BATCH_SIZE:-10}"
          SLEEP_SEC="${FEED_BATCH_SLEEP:-45}"

          echo "Fetching scan universe…"
          UNI_JSON=$(curl -sS -m 60 "$GW/scan/universe" || echo '{}')
          mapfile -t SYMBOLS < <(echo "$UNI_JSON" | jq -r '.symbols[]? // empty' 2>/dev/null || true)
          TOTAL=${#SYMBOLS[@]}
          if [ "$TOTAL" -eq 0 ]; then
            echo "Universe empty or jq missing — falling back to legacy /data-feed/run"
            curl -sS -m 90 -X POST "$GW/data-feed/run?force=true" || true
            exit 0
          fi
          echo "Universe size: $TOTAL  batch_size=$BATCH_SIZE  sleep=${SLEEP_SEC}s"

          OK_TOTAL=0
          ERR_TOTAL=0
          BATCH_NUM=0
          i=0
          while [ "$i" -lt "$TOTAL" ]; do
            BATCH_NUM=$((BATCH_NUM + 1))
            CHUNK=()
            end=$((i + BATCH_SIZE))
            [ "$end" -gt "$TOTAL" ] && end=$TOTAL
            for ((j=i; j<end; j++)); do
              CHUNK+=("\"${SYMBOLS[$j]}\"")
            done
            SYMBOLS_JSON=$(IFS=,; echo "${CHUNK[*]}")
            echo "── Batch $BATCH_NUM  symbols=[$SYMBOLS_JSON]"

            RESP=$(curl -sS -m 120 -X POST "$GW/api/feed/update-batch" \
              -H "Content-Type: application/json" \
              -d "{\"symbols\": [$SYMBOLS_JSON]}" || echo '{"ok":false}')
            echo "$RESP" | head -c 400; echo

            OK=$(echo "$RESP" | jq -r '.ok_count // 0' 2>/dev/null || echo 0)
            ER=$(echo "$RESP" | jq -r '.error_count // 0' 2>/dev/null || echo 0)
            OK_TOTAL=$((OK_TOTAL + OK))
            ERR_TOTAL=$((ERR_TOTAL + ER))

            i=$end
            if [ "$i" -lt "$TOTAL" ]; then
              # Respect upstream rate limits + keep Render free-tier awake
              echo "Sleep ${SLEEP_SEC}s (rate-limit + keep-warm)…"
              sleep "$SLEEP_SEC"
              curl -sS -m 15 "$GW/health?warm=true" >/dev/null 2>&1 || true
              curl -sS -m 12 "$GW/ops/keepalive" >/dev/null 2>&1 || true
            fi
          done

          echo "══════════════════════════════════════"
          echo "Done. ok=$OK_TOTAL errors=$ERR_TOTAL batches=$BATCH_NUM total_symbols=$TOTAL"
          if [ "$OK_TOTAL" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            echo "No symbols fed successfully"
            exit 1
          fi
          exit 0
