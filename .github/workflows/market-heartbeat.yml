# Market Hours Heartbeat — keep free-tier Render services awake during NSE session.
# Complements wake-services.yml with lighter 10-minute pings (health/docs only).
#
# GitHub cron is UTC:
#   IST 08:30 ≈ 03:00 UTC, IST 16:00 ≈ 10:30 UTC
# Job always re-checks TZ=Asia/Kolkata before curling.
#
# Required secret: API_GATEWAY_URL
# Optional: MARKET_DATA_URL, ANALYSIS_INTELLIGENCE_URL, DECISION_PREDICTION_URL, NOTIFICATION_URL
name: Market Hours Heartbeat

on:
  schedule:
    # Every 10 minutes during UTC hours covering IST market window, Mon–Fri
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Heartbeat ping (IST market window only)
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          ANALYSIS_URL: ${{ secrets.ANALYSIS_INTELLIGENCE_URL }}
          DECISION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
        run: |
          set +e
          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$(TZ=Asia/Kolkata date +%H%M)
          NOW=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')
          echo "IST now: $NOW DOW=$DOW HM=$HM"

          # Mon–Fri 08:30–16:00 IST only
          if [ "$DOW" -gt 5 ] || [ "$HM" -lt 0830 ] || [ "$HM" -gt 1600 ]; then
            echo "Outside NSE keep-awake window — skip"
            exit 0
          fi

          ping_one() {
            local name="$1"
            local base="$2"
            if [ -z "$base" ]; then
              echo "SKIP $name (secret not set)"
              return 0
            fi
            base="${base%/}"
            echo "→ $name $base"
            curl -sS --max-time 12 "$base/health?warm=true" >/dev/null \
              || curl -sS --max-time 12 "$base/health" >/dev/null \
              || curl -sS --max-time 12 "$base/docs" >/dev/null \
              || curl -sS --max-time 12 "$base/" >/dev/null \
              || echo "  WARN: $name ping failed"
          }

          GW="${API_GATEWAY_URL:-}"
          if [ -z "$GW" ]; then
            echo "API_GATEWAY_URL secret is not set — nothing to ping"
            exit 0
          fi
          GW="${GW%/}"

          # Gateway: keepalive + health
          echo "→ gateway $GW"
          curl -sS --max-time 15 "$GW/ops/keepalive" >/dev/null \
            || curl -sS --max-time 15 "$GW/health?warm=true" >/dev/null \
            || curl -sS --max-time 15 "$GW/health" >/dev/null \
            || curl -sS --max-time 15 "$GW/status" >/dev/null \
            || echo "  WARN: gateway ping failed"

          ping_one "market-data" "$MARKET_DATA_URL"
          ping_one "analysis" "$ANALYSIS_URL"
          ping_one "decision" "$DECISION_URL"
          ping_one "notification" "$NOTIFICATION_URL"

          echo "Heartbeat done"
