# Retrain prediction model — after IST midnight (Asia/Kolkata).
# 00:30 IST = 19:00 UTC previous calendar day.
name: Retrain Prediction Model

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: IST log
        run: |
          echo "IST now: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M %Z')"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/decision-prediction-service/prediction
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wake up backend services (optional)
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
        run: |
          set +e
          if [ -n "$API_GATEWAY_URL" ]; then
            curl -s -o /dev/null -w "%{http_code}" "$API_GATEWAY_URL/health" || true
          fi
          if [ -n "$MARKET_DATA_URL" ]; then
            curl -s -o /dev/null -w "%{http_code}" "$MARKET_DATA_URL/health" || true
          fi
          sleep 10

      - name: Retrain model
        working-directory: services/decision-prediction-service/prediction
        run: |
          python pred_train.py

      # E575 (round 550): champion / challenger. The challenger's model_meta.json is compared with the meta saved next to the model in production
      # (data/prediction-model/model_meta.json). Promoted unless it is clearly worse (F1 or top-slice precision down by more than GATE_MAX_DROP).
      # An unreadable challenger meta is NOT promoted. No champion meta yet = promote. The decision is printed in this step's log.
      - name: Gate (champion / challenger)
        id: gate
        env:
          GATE_MAX_DROP: "0.03"
        run: |
          set +e
          python scripts/model_gate.py \
            --old data/prediction-model/model_meta.json \
            --new services/decision-prediction-service/prediction/model_meta.json \
            --max-drop "$GATE_MAX_DROP" --json /tmp/model_gate.json
          rc=$?
          if [ "$rc" = "0" ]; then
            echo "promote=yes" >> "$GITHUB_OUTPUT"
          else
            echo "promote=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Model gate kept the old model (exit $rc). See the log lines above."
          fi
          exit 0

      - name: Copy the promoted model and its meta
        if: steps.gate.outputs.promote == 'yes'
        run: |
          mkdir -p data/prediction-model
          cp services/decision-prediction-service/prediction/model.pkl data/prediction-model/model.pkl
          cp services/decision-prediction-service/prediction/model_meta.json data/prediction-model/model_meta.json

      - name: Commit and push updated model
        if: steps.gate.outputs.promote == 'yes'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/prediction-model/model.pkl data/prediction-model/model_meta.json || true
          if git diff --staged --quiet; then
            echo "No changes to model"
          else
            git commit -m "Auto-retrain prediction model [skip ci]"
            git push
          fi
