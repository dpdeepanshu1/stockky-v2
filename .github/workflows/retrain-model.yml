name: Retrain Prediction Model

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: services/decision-prediction-service/prediction
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wake up backend services
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          TECHNICAL_URL: ${{ secrets.TECHNICAL_URL }}
          FUNDAMENTAL_URL: ${{ secrets.FUNDAMENTAL_URL }}
          DECISION_URL: ${{ secrets.DECISION_URL }}
        run: |
          echo "Waking up backend services..."
          curl -I $API_GATEWAY_URL/health || true
          curl -I $MARKET_DATA_URL/health || true
          curl -I $TECHNICAL_URL/health || true
          curl -I $FUNDAMENTAL_URL/health || true
          curl -I $DECISION_URL/health || true
          echo "Waiting 60 seconds..."
          sleep 60

      - name: Retrain model
        working-directory: services/decision-prediction-service/prediction
        run: |
          python train.py
          mkdir -p ../../../data/prediction-model
          cp model.pkl ../../../data/prediction-model/model.pkl

      - name: Commit and push updated model
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/prediction-model/model.pkl
          if git diff --staged --quiet; then
            echo "No changes to model.pkl"
          else
            git commit -m "Auto-retrain prediction model [skip ci]"
            git push
          fi