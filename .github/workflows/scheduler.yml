# Stockky Scheduler — IST (Asia/Kolkata) market-aware only.
# GitHub cron is UTC; times below map to NSE session windows.
#
# IST 09:15–15:30 ≈ UTC 03:45–10:00 (Mon–Fri)
name: Stockky Scheduler

on:
  schedule:
    # Every 15 min during UTC hours covering IST market Mon–Fri
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force_scan:
        description: "Force scan (bypass market hours)"
        required: false
        default: false
        type: boolean

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: IST gate (Asia/Kolkata)
        id: ist
        run: |
          set -e
          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$(TZ=Asia/Kolkata date +%H%M)
          NOW=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')
          echo "IST now: $NOW DOW=$DOW HM=$HM"
          RUN=0
          if [ "$DOW" -le 5 ] && [ "$HM" -ge 0900 ] && [ "$HM" -le 1545 ]; then
            RUN=1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_scan }}" = "true" ]; then
            RUN=1
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [ "$RUN" -eq 0 ]; then
            echo "Outside IST market window — skip scheduler tick"
          fi

      - name: Install dependencies
        if: steps.ist.outputs.run == '1'
        run: |
          pip install -r services/notification-scheduler-service/scheduler/requirements.txt

      - name: Wake up services
        if: steps.ist.outputs.run == '1'
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          ANALYSIS_URL: ${{ secrets.ANALYSIS_INTELLIGENCE_URL }}
          DECISION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          if [ -z "$GW" ]; then
            echo "API_GATEWAY_URL not set — skip wake"
            exit 0
          fi
          echo "Waking via $GW/wake-all (IST market window only) ..."
          curl -fsS -m 60 -X POST "$GW/wake-all" || curl -fsS -m 60 "$GW/wake-all" || true
          for U in "$API_GATEWAY_URL" "$MARKET_DATA_URL" "$NOTIFICATION_URL" "$ANALYSIS_URL" "$DECISION_URL"; do
            [ -z "$U" ] && continue
            curl -fsS -m 20 "${U%/}/health?warm=true" || curl -fsS -m 15 "${U%/}/health" || true
          done
          # Lightweight keepalive (no deep fan-out)
          curl -fsS -m 15 "$GW/ops/keepalive" || true
          if [ -n "$NOTIFICATION_URL" ]; then
            curl -fsS -m 30 -X POST "${NOTIFICATION_URL%/}/outbox/process" || true
          fi
          sleep 20

      - name: Ensure Data Feed is fresh enough (non-blocking)
        if: steps.ist.outputs.run == '1'
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          [ -n "$GW" ] || exit 0
          # Check status — if never run or empty, kick a background feed (does not block scan)
          ST=$(curl -fsS -m 20 "$GW/data-feed/status" || echo '{}')
          echo "data-feed status: $ST" | head -c 400; echo
          # Only start feed if idle/missing — force=false so we never double-run
          echo "$ST" | grep -q '"status":"running"' && { echo "Data feed already running"; exit 0; }
          # If meta missing or last_count is 0, start feed in background via API
          if echo "$ST" | grep -Eq '"status":"(idle|done|error)"' || ! echo "$ST" | grep -q last_count; then
            curl -fsS -m 25 -X POST "$GW/data-feed/run?force=false" || true
            echo "Data feed kick issued (background)"
          fi

      - name: Run scheduler tick
        if: steps.ist.outputs.run == '1'
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          EVENT_TRACKER_URL: ${{ secrets.EVENT_TRACKER_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan == true && 'true' || 'false' }}
        run: |
          export USE_FULL_UNIVERSE=true
          export USE_GATEWAY_ASYNC_SCAN=true
          export BATCH_TIMEOUT=300
          export SCAN_TIMEOUT_TOTAL=5400
          python services/notification-scheduler-service/scheduler/run_once.py

      - name: Post-scan T+1/T+5 evaluation (closed-loop)
        if: steps.ist.outputs.run == '1'
        env:
          DECISION_PREDICTION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
          DECISION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
        run: |
          set +e
          D="${DECISION_PREDICTION_URL:-$DECISION_URL}"
          D="${D%/}"
          [ -z "$D" ] && { echo "No DECISION_PREDICTION_URL — skip evaluate"; exit 0; }
          curl -fsS -m 25 "$D/health" || true
          sleep 5
          curl -fsS -m 120 -X POST "$D/training/api/evaluate/t1?max_batch=40" || curl -fsS -m 120 -X POST "$D/api/evaluate/t1?max_batch=40" || true
          curl -fsS -m 120 -X POST "$D/training/api/evaluate/t5?max_batch=40" || curl -fsS -m 120 -X POST "$D/api/evaluate/t5?max_batch=40" || true
