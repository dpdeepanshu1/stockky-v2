name: Stockky Scheduler

on:
  schedule:
    # Primary hourly-ish ticks IST morning–afternoon
    - cron: "50 2-9 * * 1-5"
    # Denser alert/scan during NSE hours (~every 10 min Mon–Fri)
    - cron: "*/10 3-10 * * 1-5"

  workflow_dispatch:
    inputs:
      force_scan:
        description: "Force scan (bypass market hours)"
        required: false
        default: false
        type: boolean

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r services/notification-scheduler-service/scheduler/requirements.txt
          # also install sibling package deps if present
          if [ -f services/notification-scheduler-service/scheduler/requirements.txt ]; then
            pip install -r services/notification-scheduler-service/scheduler/requirements.txt
          fi

      - name: Wake up services
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          TECHNICAL_URL: ${{ secrets.TECHNICAL_URL }}
          FUNDAMENTAL_URL: ${{ secrets.FUNDAMENTAL_URL }}
          DECISION_URL: ${{ secrets.DECISION_URL }}
          NEWS_URL: ${{ secrets.NEWS_URL }}
          EVENT_TRACKER_URL: ${{ secrets.EVENT_TRACKER_URL }}
          PREDICTION_URL: ${{ secrets.PREDICTION_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          MARKET_SENTIMENT_URL: ${{ secrets.MARKET_SENTIMENT_URL }}
          TRAINING_URL: ${{ secrets.TRAINING_URL }}
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          echo "Waking via $GW/wake-all ..."
          curl -fsS -m 60 -X POST "$GW/wake-all" || curl -fsS -m 60 "$GW/wake-all" || true
          for U in "$API_GATEWAY_URL" "$MARKET_DATA_URL" "$TECHNICAL_URL" "$FUNDAMENTAL_URL"                    "$DECISION_URL" "$NEWS_URL" "$EVENT_TRACKER_URL" "$PREDICTION_URL"                    "$NOTIFICATION_URL" "$MARKET_SENTIMENT_URL" "$TRAINING_URL" "$SCHEDULER_URL"; do
            [ -z "$U" ] && continue
            curl -fsS -m 20 "${U%/}/health?warm=true" || curl -fsS -m 15 "${U%/}/health" || true
          done
          # Drain alert outbox
          if [ -n "$NOTIFICATION_URL" ]; then
            curl -fsS -m 30 -X POST "${NOTIFICATION_URL%/}/outbox/process" || true
          fi
          echo "Waiting 60 seconds for free-tier dynos..."
          sleep 60

      - name: Run scheduler tick
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          EVENT_TRACKER_URL: ${{ secrets.EVENT_TRACKER_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # FORCE_SCAN is set only when running manually with the checkbox ticked
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan == true && 'true' || 'false' }}
        run: |
          export USE_FULL_UNIVERSE=true
          export USE_GATEWAY_ASYNC_SCAN=true
          export BATCH_TIMEOUT=300
          export SCAN_TIMEOUT_TOTAL=5400
          python services/notification-scheduler-service/scheduler/run_once.py
# Updated for 5-service architecture. Set secrets for the 5 placeholder/real URLs.
