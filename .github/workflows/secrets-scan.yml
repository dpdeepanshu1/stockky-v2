# F32 (2026-10-22): a full admin JWT in a saved run output and an Upstash token in .env.example were both found by hand. This runs
# scripts/check_secrets.py (stdlib, offline, never prints a value) on EVERY push and pull request - no path filter, because a secret
# can arrive in any file - and once a week for anything that slipped in through a squash or a force-push.
# A hit means: rotate the secret, delete it from the file and from every copy / zip. A known false positive goes in scripts/secrets_allowlist.txt.
name: Secrets scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No secret-looking values or secret-type files in the tree
        run: python3 scripts/check_secrets.py
      - name: The scanner's own tests
        run: |
          pip install pytest
          python -m pytest scripts/test_check_secrets.py -q
