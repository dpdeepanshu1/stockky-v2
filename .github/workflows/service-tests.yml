# Offline unit tests for every service. No secrets, no network, no broker:
# every test runs against in-memory SQLite and scripted fakes (see each service's tests/).
# A failure here means real order-placement / reconciliation / risk / scanning logic changed behaviour.
# group315: was position-stocks + real-trade only; now all seven services, the pinned constraints.txt (when present),
# and the shared-copy / env-reference checks.
name: Service unit tests

on:
  push:
    branches: [main, backup-production]
    paths:
      - "services/**"
      - "shared/market_structure/**"
      - "scripts/sync_market_structure.py"
      - "scripts/check_shared_copies.py"
      - "scripts/check_merge_conflicts.py"
      - "scripts/shared_copies_baseline.json"
      - "scripts/gen_env_reference.py"
      - "scripts/_repo_walk.py"
      - "scripts/test_repo_scripts.py"
      - "scripts/test_ms_ab_report.py"
      - "scripts/structure_gate_check.py"
      - "scripts/test_structure_gate_check.py"
      - "scripts/board_parity_check.py"
      - "scripts/test_board_parity_check.py"
      - "scripts/calibration_pack.py"
      - "scripts/test_calibration_pack.py"
      - "scripts/vm_calibrate.sh"
      - "scripts/test_vm_calibrate.py"
      - "scripts/check_market_data_url_default.py"
      - "scripts/legacy_gate_backtest.py"
      - "scripts/test_legacy_gate_backtest.py"
      - "scripts/opening_replay.py"
      - "scripts/test_opening_replay.py"
      - "docker-compose.yml"
      - "scripts/check_table_name_collisions.py"
      - "scripts/ms_ab_report.py"
      - "scripts/fetch_history_for_backtest.py"
      - "docs/ENV_REFERENCE.md"
      - ".env.example"
      - ".env.oracle.recommended"
      - ".github/workflows/service-tests.yml"
  pull_request:
    paths:
      - "services/**"
      - "shared/market_structure/**"
      - "scripts/sync_market_structure.py"
      - "scripts/check_shared_copies.py"
      - "scripts/check_merge_conflicts.py"
      - "scripts/shared_copies_baseline.json"
      - "scripts/gen_env_reference.py"
      - "scripts/_repo_walk.py"
      - "scripts/test_repo_scripts.py"
      - "scripts/test_ms_ab_report.py"
      - "scripts/structure_gate_check.py"
      - "scripts/test_structure_gate_check.py"
      - "scripts/board_parity_check.py"
      - "scripts/test_board_parity_check.py"
      - "scripts/calibration_pack.py"
      - "scripts/test_calibration_pack.py"
      - "scripts/vm_calibrate.sh"
      - "scripts/test_vm_calibrate.py"
      - "scripts/check_market_data_url_default.py"
      - "scripts/legacy_gate_backtest.py"
      - "scripts/test_legacy_gate_backtest.py"
      - "scripts/opening_replay.py"
      - "scripts/test_opening_replay.py"
      - "docker-compose.yml"
      - "scripts/ms_ab_report.py"
      - "scripts/fetch_history_for_backtest.py"
      - "docs/ENV_REFERENCE.md"
      - ".env.example"
      - ".env.oracle.recommended"
      - ".github/workflows/service-tests.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No leftover git merge-conflict markers (a half-resolved merge crash-looped position-stocks on 2026-10-13)
        run: python3 scripts/check_merge_conflicts.py
      - name: A fix must land in every copy of a duplicated module
        run: python3 scripts/check_shared_copies.py
      - name: NSE holiday lists agree
        run: python3 scripts/check_holiday_lists_sync.py
      - name: docs/ENV_REFERENCE.md is current (regenerate with scripts/gen_env_reference.py)
        run: python3 scripts/gen_env_reference.py --check
      - name: No service defaults MARKET_DATA_URL to a public onrender.com host (group379)
        run: |
          pip install pyyaml
          python3 scripts/check_market_data_url_default.py
      - name: No cross-service table-name clashes (one shared Oracle schema)
        run: python3 scripts/check_table_name_collisions.py
      - name: No new direct yfinance imports outside the allow-list
        run: python3 scripts/check_price_source_imports.py
      - name: Repo scripts (venv-safe scanning, version-stable shared-copy hash)
        run: |
          pip install pytest
          python -m pytest scripts/test_repo_scripts.py scripts/test_ms_ab_report.py scripts/test_legacy_gate_backtest.py scripts/test_opening_replay.py scripts/test_structure_gate_check.py scripts/test_ms_g1_check.py scripts/test_board_parity_check.py scripts/test_calibration_pack.py scripts/test_vm_calibrate.py -q

  test:
    name: ${{ matrix.service }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: position-stocks-service, python-version: "3.11", tests: "tests"}
          - {service: position-stocks-service, python-version: "3.12", tests: "tests"}   # 3.11 = the Dockerfiles, 3.12 = the Ubuntu VM
          - {service: real-trade-service, python-version: "3.11", tests: "tests"}
          - {service: real-trade-service, python-version: "3.12", tests: "tests"}
          - {service: market-data-service, python-version: "3.11", tests: "tests"}
          - {service: analysis-intelligence-service, python-version: "3.11", tests: "tests"}
          - {service: api-gateway, python-version: "3.11", tests: "tests"}
          - {service: notification-scheduler-service, python-version: "3.11", tests: "tests"}
          - {service: decision-prediction-service, python-version: "3.11", tests: "training/tests prediction/tests decision/tests"}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install (pinned when constraints.txt exists)
        run: |
          c=""; [ -f constraints.txt ] && c="-c constraints.txt"
          pip install -r requirements.txt $c pytest pytest-cov pytest-asyncio pytest-timeout
      - name: Unit tests
        # decision-prediction keeps its tests in three sub-folders, each with its own conftest / rootdir
        run: |
          for d in ${{ matrix.tests }}; do
            if [ "$d" = "tests" ]; then python -m pytest tests -q --timeout=120; else (cd "$(dirname "$d")" && python -m pytest tests -q --timeout=120); fi
          done
