# Structure A/B backtest (group 375, WS-7 / gate G2). Manual run only: Actions -> Stockky Structure Backtest -> Run workflow.
# Downloads daily candles through the market-data service, replays the structure engine with no look-ahead and compares the structure policy with a
# technical-only baseline after costs (scripts/ms_ab_report.py). The report is printed in the run summary and uploaded as an artifact.
# Secrets: MARKET_DATA_URL (required, https://...), API_GATEWAY_URL (optional: symbol universe from /api/universe; without it pass `symbols`).
# The default is a random 400-symbol sample (not the alphabetical head), drawn with `seed` from the sorted universe, so the same seed is the same sample
# whatever order the universe endpoint returns; the drawn symbols are saved in sample_manifest.json in the artifact. Change `seed` to check that the
# verdict does not depend on WHICH 400 stocks were drawn. Lower `limit` (150 is about 15 minutes) if the market-data host rate limits. The verdict stays
# `insufficient_sample` below min_n signals.
name: Stockky Structure Backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "random sample size (0 = whole universe; the market-data host is rate limited, so go up gradually)"
        required: false
        default: "400"
      seed:
        description: "random seed for the sample (same seed = same symbols)"
        required: false
        default: "7"
      symbols:
        description: "optional comma-separated symbols (overrides the universe)"
        required: false
        default: ""
      period:
        description: "history period"
        required: false
        default: "5y"
      step:
        description: "replay every Nth day (3 = every third session)"
        required: false
        default: "3"
      horizon:
        description: "headline horizon in sessions (1, 5, 10 or 20)"
        required: false
        default: "10"
      min_n:
        description: "minimum signals per group before any verdict"
        required: false
        default: "200"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Fetch daily history
        env:
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          LIMIT: ${{ github.event.inputs.limit || '400' }}
          SEED: ${{ github.event.inputs.seed || '7' }}
          SYMBOLS: ${{ github.event.inputs.symbols || '' }}
          PERIOD: ${{ github.event.inputs.period || '5y' }}
        run: |
          set -e
          [ -n "$MARKET_DATA_URL" ] || { echo "MARKET_DATA_URL secret missing"; exit 1; }
          case "$MARKET_DATA_URL" in http://*|https://*) ;; *) echo "MARKET_DATA_URL must include https://"; exit 1;; esac
          curl -sS -m 60 "${MARKET_DATA_URL%/}/health" >/dev/null || true   # wake a sleeping free-tier host
          sleep 10
          if [ -n "$SYMBOLS" ]; then SRC="--symbols $SYMBOLS"
          elif [ -n "$API_GATEWAY_URL" ]; then
            curl -sS -m 60 "${API_GATEWAY_URL%/}/health?warm=true" >/dev/null || true
            sleep 10
            SRC="--universe-url ${API_GATEWAY_URL%/}/api/universe"
          else echo "pass symbols or set the API_GATEWAY_URL secret"; exit 1; fi
          python3 scripts/fetch_history_for_backtest.py hist $SRC --period "$PERIOD" --sample "$LIMIT" --seed "$SEED" --manifest sample_manifest.json --sleep 1.5

      - name: Run the A/B report
        env:
          STEP: ${{ github.event.inputs.step || '3' }}
          HORIZON: ${{ github.event.inputs.horizon || '10' }}
          MIN_N: ${{ github.event.inputs.min_n || '200' }}
        run: |
          set -e
          python3 scripts/ms_ab_report.py hist --out ab_out --step "$STEP" --horizon "$HORIZON" --min-n "$MIN_N" --jobs "$(nproc)" | tee ab_out_console.txt
          cp ab_out/ab_report.md "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-ab-report
          path: |
            ab_out/
            ab_out_console.txt
            sample_manifest.json
