# Pre-market bulk price feed for Hot Picks, ~08:45 IST (5 min before the
# IPO premarket workflow, so both finish comfortably before session open).
# Calls the same bulk pipeline the Data Feed tab uses (bhavcopy first, then
# ONE POST /quotes/bulk call) against the FULL eligible universe — not just
# Hot Picks' catalyst-seeded shortlist — so by the time "Search Hot Picks
# Stocks" runs, its price-enrichment step (a pure store READ, no network)
# finds fresh data instead of showing "₹—" on cold symbols.
#
# GitHub cron is UTC: 08:45 IST ≈ 03:15 UTC.
# Secrets: API_GATEWAY_URL
name: Hot Picks Premarket Refresh

on:
  schedule:
    - cron: "15 3 * * 1-5"
  workflow_dispatch:

jobs:
  hot-picks-premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run Hot Picks premarket bulk pre-feed
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          [ -n "$GW" ] || { echo "API_GATEWAY_URL secret missing"; exit 0; }

          DOW=$(TZ=Asia/Kolkata date +%u)
          NOW=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')
          echo "IST now: $NOW DOW=$DOW"
          if [ "$DOW" -gt 5 ]; then
            echo "Weekend — skip"
            exit 0
          fi

          echo "Warm ping…"
          curl -sS -m 30 "$GW/health?warm=true" >/dev/null 2>&1 || true
          sleep 5

          echo "POST $GW/stockky-hot/premarket"
          code=$(curl -sS -o /tmp/hot_pm.json -w "%{http_code}" \
            -X POST "$GW/stockky-hot/premarket" \
            --max-time 60 || echo "000")
          echo "HTTP $code"
          cat /tmp/hot_pm.json 2>/dev/null || true

          # POST just starts the background job — poll status until it
          # finishes so this workflow's log shows the real outcome.
          for i in $(seq 1 40); do
            sleep 15
            st=$(curl -sS -m 20 "$GW/stockky-hot/premarket/status" || echo '{}')
            echo "status: $st"
            phase=$(echo "$st" | grep -o '"status"[^,}]*' | head -1)
            case "$phase" in
              *done*|*error*) break ;;
            esac
          done
          echo "Hot Picks premarket pre-feed finished (or timed out watching status — non-fatal)"
