# ============================================================================
# Stockky — nginx reverse proxy for the Oracle Cloud Ubuntu VM
# Domain: stockky.duckdns.org   (TLS via certbot)
#
# Put this file at:  /etc/nginx/sites-available/stockky
# Enable it with:    sudo ln -s /etc/nginx/sites-available/stockky /etc/nginx/sites-enabled/
#                    sudo nginx -t && sudo systemctl reload nginx
#
# Then get the certificate (certbot rewrites the :443 server block for you):
#   sudo certbot --nginx -d stockky.duckdns.org
#
# What this fixes vs. a basic proxy:
#  * Long proxy timeouts (300s)  -> no more 504 Gateway Timeout on the IPO scan,
#    premarket scan, market scan, or training triggers (those legitimately take
#    a while on the free/small tier).
#  * WebSocket upgrade on /api/  -> the /ws/jobs live channel stays connected.
#  * The frontend is served by `vite preview` (static build, NO HMR socket), so
#    the old ~5s reload loop is gone; this config just proxies plainly to it.
# ============================================================================

# Map for WebSocket upgrade (shared by the location blocks below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name stockky.duckdns.org;

    # certbot will add the redirect to https here after you run it.
    # Until then, everything still works over http on port 80.

    # Upload / request body ceiling (CSV imports, model uploads, etc.)
    client_max_body_size 25m;

    # ----- Frontend (built static bundle served by vite preview on :5173) -----
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # vite preview has no websocket, but keep upgrade headers harmless-safe.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ----- API gateway (:8000). Trailing slash strips the /api/ prefix, so the
    #       gateway receives /scan, /data-feed, /health, /ws/jobs, ... -----
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the /api/ws/jobs live jobs channel.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long timeouts so scans / IPO / premarket / training don't 504.
        proxy_connect_timeout  30s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;

        # Don't buffer streaming/long responses.
        proxy_buffering off;
    }

    # ----- Real Trade service (:8005). Separate trust boundary from the main
    #       api-gateway on purpose (admin-session auth, live brokerage
    #       connection) — see frontend/src/realTradeApi.ts. Without this
    #       block there is NO route to real-trade-service at all through
    #       this domain, which is why "Failed to fetch" happens in the Real
    #       Automatic Trade tab even once the service itself is healthy:
    #       the frontend is served over https (once certbot runs), and a
    #       browser will silently block a plain http://<ip>:8005 request
    #       from an https page as mixed content — it needs to be reachable
    #       under the SAME https domain instead. Trailing slash strips the
    #       /realtrade/ prefix, same convention as the /api/ block above.
    location /realtrade/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # BUG FIX (31-Aug-2026): was 60s/60s. The dashboard's own "Live Cycle
        # Status" panel showed a manual REAL cycle taking 71.2s — already past
        # this limit — and REAL cycles (candidates -> risk -> live Dhan order
        # -> reconcile, see cycle_runner.py) routinely run longer than that
        # once NSE/Dhan round-trips are slow, which is exactly what produced
        # the "504 Gateway Time-out" banner on the Pipeline tab: nginx severs
        # the connection before real-trade-service finishes and returns its
        # own timeout page instead of relaying the actual response (the
        # backend cycle itself may complete fine either way, but the
        # dashboard never finds out). Matched to the /api/ block's 300s above,
        # for the same reason it was raised there.
        proxy_connect_timeout  30s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stockky.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stockky.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = stockky.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name stockky.duckdns.org;
    return 404; # managed by Certbot


}