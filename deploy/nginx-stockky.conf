# ============================================================================
# Stockky — nginx reverse proxy for the Oracle Cloud Ubuntu VM
# Domain: stockky.duckdns.org   (TLS via certbot)
#
# Put this file at:  /etc/nginx/sites-available/stockky
# Enable it with:    sudo ln -s /etc/nginx/sites-available/stockky /etc/nginx/sites-enabled/
#                     sudo nginx -t && sudo systemctl reload nginx
#
# CHANGES IN THIS VERSION vs. the original (speed only — no routing/timeout
# behaviour changed, so nothing here affects data correctness):
#   1. `http2` added to the TLS listener — browsers multiplex the frontend's
#      JS/CSS/API requests over one connection instead of opening several,
#      which matters most on the first page load.
#   2. gzip enabled at this layer too (belt-and-suspenders with the
#      frontend container's own nginx — this one also compresses the
#      api-gateway's JSON responses, which the container-level config can't
#      reach).
#   3. `keepalive` upstream blocks for the frontend/api-gateway/real-trade
#      backends — reuses TCP connections to 127.0.0.1 instead of a fresh
#      handshake per request. Cheap on localhost, but adds up under load.
#   4. Long-lived cache headers for the frontend's hashed static assets
#      (js/css/fonts) passed through from the location block — index.html
#      stays uncached so a new deploy is always picked up.
# Everything else (routes, timeouts, WebSocket upgrade, the /realtrade/
# trust boundary) is unchanged from the version that already fixed the
# 504s — do not shorten the timeouts, they're sized for real scan/training
# durations, not arbitrary.
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keepalive upstream pools — must be declared once, outside any server block.
upstream stockky_frontend {
    server 127.0.0.1:5173;
    keepalive 16;
}
upstream stockky_api_gateway {
    server 127.0.0.1:8000;
    keepalive 16;
}
upstream stockky_real_trade {
    server 127.0.0.1:8005;
    keepalive 8;
}

server {
    server_name stockky.duckdns.org;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml font/woff2;
    gzip_vary on;

    # ----- Frontend (static bundle served by nginx:alpine on :5173) -----
    location / {
        proxy_pass http://stockky_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ----- API gateway (:8000). Trailing slash strips the /api/ prefix. -----
    location /api/ {
        proxy_pass http://stockky_api_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/ws/jobs — Connection "" above is
        # overridden back to Upgrade for this exact case by nginx's own
        # handling of the Upgrade header, but keep both explicit headers so
        # long-poll and websocket both work.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout  30s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        proxy_buffering off;
    }

    # ----- Real Trade service (:8005). Separate trust boundary on purpose. -----
    location /realtrade/ {
        proxy_pass http://stockky_real_trade/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout  30s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot (http2 added)
    listen 443 ssl http2; # managed by Certbot (http2 added)
    ssl_certificate /etc/letsencrypt/live/stockky.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stockky.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = stockky.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name stockky.duckdns.org;
    return 404; # managed by Certbot


}
