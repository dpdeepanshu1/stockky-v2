# Stockky v2 — local / Oracle Cloud VM
# Requires a .env in this directory (see .env.example for Neon, .env.oracle.example for Oracle).
#
# TWO DATABASE MODES, SAME CODE — chosen purely by env, no code changes:
#   • Neon / Postgres  → set DATABASE_URL / CACHE_DATABASE_URL (Render uses this).
#   • Oracle Autonomous → set ORACLE_DSN + ORACLE_* (this compose mounts the wallet).
# When ORACLE_DSN is set, the durable core (data-feed cache, trades, training,
# predictions, watchlist, notifications) runs on Oracle. The secondary surprise
# premarket scanner is Postgres-only and safely no-ops on Oracle.
#
# CRITICAL: without env_file + DATABASE_* / ORACLE_* below, api-gateway runs
# memory-only and loses data-feed / trades / training / surprise on every restart.
#
# Oracle wallet: unzip the Instance Wallet on the HOST, set ORACLE_WALLET_HOST_DIR
# in .env to that host path. Inside every container it is mounted read-only at
# /oracle_wallet, which is what ORACLE_WALLET_DIR / TNS_ADMIN point to below.

services:
  market-data-service:
    build: ./services/market-data-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      YFINANCE_MAX_CONCURRENT: ${YFINANCE_MAX_CONCURRENT:-6}
      YFINANCE_MIN_INTERVAL_SEC: ${YFINANCE_MIN_INTERVAL_SEC:-0.08}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8001"
      # ── Oracle Autonomous DB (Oracle Cloud side only; empty on Render/Neon) ──
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      # mTLS wallet (Oracle only). Empty & unused on Neon.
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    restart: unless-stopped

  analysis-intelligence-service:
    build: ./services/analysis-intelligence-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      MARKET_DATA_URL: http://market-data-service:8001
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8000"
      # ── Oracle Autonomous DB (Oracle Cloud side only; empty on Render/Neon) ──
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - market-data-service
    restart: unless-stopped

  decision-prediction-service:
    build: ./services/decision-prediction-service
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      MARKET_DATA_URL: http://market-data-service:8001
      TECHNICAL_URL: http://analysis-intelligence-service:8000/technical
      FUNDAMENTAL_URL: http://analysis-intelligence-service:8000/fundamental
      NEWS_URL: http://analysis-intelligence-service:8000/news
      EVENT_URL: http://analysis-intelligence-service:8000/event
      PREDICTION_URL: http://decision-prediction-service:8000/prediction
      TRAINING_SERVICE_URL: http://decision-prediction-service:8000/training
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      # Training / paper trades durable store
      DATABASE_URL: ${DATABASE_URL:-}
      TRAINING_DATABASE_URL: ${TRAINING_DATABASE_URL:-${DATABASE_URL:-}}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8000"
      # ── Oracle Autonomous DB (Oracle Cloud side only; empty on Render/Neon) ──
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - market-data-service
      - analysis-intelligence-service
    restart: unless-stopped

  notification-scheduler-service:
    build: ./services/notification-scheduler-service
    ports:
      - "8008:8000"
    env_file:
      - .env
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8000"
      # ── Oracle Autonomous DB (Oracle Cloud side only; empty on Render/Neon) ──
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MARKET_DATA_URL: http://market-data-service:8001
      TECHNICAL_URL: http://analysis-intelligence-service:8000/technical
      FUNDAMENTAL_URL: http://analysis-intelligence-service:8000/fundamental
      NEWS_URL: http://analysis-intelligence-service:8000/news
      EVENT_URL: http://analysis-intelligence-service:8000/event
      MARKET_SENTIMENT_URL: http://analysis-intelligence-service:8000/sentiment
      DECISION_URL: http://decision-prediction-service:8000/decision
      PREDICTION_URL: http://decision-prediction-service:8000/prediction
      TRAINING_URL: http://decision-prediction-service:8000/training
      NOTIFICATION_URL: http://notification-scheduler-service:8000/notification
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      # Neon — required for durable data-feed / surprise / watchlist / kv
      DATABASE_URL: ${DATABASE_URL:-}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-}
      TRAINING_DATABASE_URL: ${TRAINING_DATABASE_URL:-${DATABASE_URL:-}}
      USE_REDIS: ${USE_REDIS:-0}
      DISABLE_UPSTASH: ${DISABLE_UPSTASH:-1}
      PORT: "8000"
      # ── Oracle Autonomous DB (Oracle Cloud side only; empty on Render/Neon) ──
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - market-data-service
      - analysis-intelligence-service
      - decision-prediction-service
    restart: unless-stopped

  real-trade-service:
    build: ./services/real-trade-service
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      # This is the concrete fix for the "http://real-trade-service:8000/
      # not working" issue: inside docker-compose, other containers reach
      # this one by its COMPOSE SERVICE NAME (real-trade-service) as the
      # hostname — never localhost/127.0.0.1, which inside a container
      # means "this container", not "the host machine" or "another
      # container". The port also has to match what this container
      # actually listens on: 8005 (this Dockerfile's PORT/CMD), not 8000
      # — 8000 is api-gateway's port. So from api-gateway or the frontend
      # container, the correct internal URL is:
      #     http://real-trade-service:8005
      API_GATEWAY_URL: http://api-gateway:8000
      MARKET_DATA_URL: http://market-data-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-scheduler-service:8000/notification
      PORT: "8005"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # Alternative to ADMIN_PASSWORD_HASH above — base64 of the same hash,
      # so the $ characters in a raw Argon2id hash never hit docker-compose's
      # own variable interpolation. See config.py for the encode command.
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DHAN_CREDENTIAL_ENC_KEY: ${DHAN_CREDENTIAL_ENC_KEY:-}
      DHAN_ENV: ${DHAN_ENV:-sandbox}
      DHAN_TOTP_ENABLED: ${DHAN_TOTP_ENABLED:-false}
      # How many days a pasted Dhan access token is valid for before the
      # gate auto-disarms REAL trading and asks for a fresh one. Dhan
      # access tokens are valid for exactly 24 hours for every account
      # (SEBI/exchange-mandated — confirmed on Dhan's own docs/support
      # pages) — keep this at 1. Setting it higher makes the admin UI
      # countdown lie and lets the gate stay "armed" long after Dhan has
      # actually rejected the token, so REAL orders fail silently instead
      # of auto-disarming.
      DHAN_TOKEN_LIFETIME_DAYS: ${DHAN_TOKEN_LIFETIME_DAYS:-1}
      # Auto-Pilot (2026-08-27) — background loop that runs the same cycle
      # Run Cycle runs, on a timer, so armed trading keeps working with the
      # dashboard closed. Off per-mode by default (toggle in the Pipeline
      # tab); these only control timing/notifications once turned on.
      # Reuses the same TELEGRAM_BOT_TOKEN/CHAT_ID as the scan-notification
      # scheduler below — set them once, both services pick them up.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AUTO_PILOT_INTERVAL_SECONDS: ${AUTO_PILOT_INTERVAL_SECONDS:-180}
      AUTO_PILOT_NOTIFY_HEARTBEAT: ${AUTO_PILOT_NOTIFY_HEARTBEAT:-false}
      # Neon — same instance every other service uses (set DATABASE_URL in
      # .env if running Postgres/Neon mode instead of Oracle)
      DATABASE_URL: ${DATABASE_URL:-}
      # ── Oracle Autonomous DB (Oracle Cloud side only; empty on Render/Neon) ──
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - api-gateway
      - market-data-service
      - notification-scheduler-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_API_URL is inlined at BUILD time. Pulled from .env (Docker
        # Compose auto-loads .env for ${...} substitution). Set
        # VITE_API_URL=https://stockky.duckdns.org/api in .env on the Oracle VM.
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - api-gateway
    restart: unless-stopped
