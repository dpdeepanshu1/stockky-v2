# Stockky v2 — local / Oracle Cloud VM
# Requires a .env in this directory (see .env.example for Neon, .env.oracle.example for Oracle).
#
# CHANGES IN THIS VERSION (speed/stability tuning for a 2 vCPU / 12 GB Oracle
# free-tier VM running all 6 services + Oracle wallet mTLS on one box):
#   1. Added `cpus:` / `mem_limit:` / `mem_reservation:` to every service so
#      one noisy container (e.g. sklearn training inside decision-prediction,
#      or a big pandas scan inside analysis-intelligence) can never starve
#      the others or push the host into swap/OOM. Numbers are sized to sum
#      comfortably under 12 GB RAM with headroom for the OS, Docker itself,
#      and the Oracle wallet's TLS session buffers.
#   2. `logging` driver capped (json-file, max-size/max-file) on every
#      service — uncapped container logs are a classic silent disk-fill/IO
#      slowdown on a small VM over weeks of uptime; nothing here changes.
#   3. frontend now builds to a tiny nginx:alpine image instead of running
#      a Node `vite preview` process (see frontend/Dockerfile) — same
#      static bundle, ~1/10th the RAM, faster first byte.
#
# TWO DATABASE MODES, SAME CODE — chosen purely by env, no code changes:
#   • Neon / Postgres  → set DATABASE_URL / CACHE_DATABASE_URL (Render uses this).
#   • Oracle Autonomous → set ORACLE_DSN + ORACLE_* (this compose mounts the wallet).
#
# CRITICAL: without env_file + DATABASE_* / ORACLE_* below, api-gateway runs
# memory-only and loses data-feed / trades / training / surprise on every restart.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  market-data-service:
    build: ./services/market-data-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      YFINANCE_MAX_CONCURRENT: ${YFINANCE_MAX_CONCURRENT:-6}
      YFINANCE_MIN_INTERVAL_SEC: ${YFINANCE_MIN_INTERVAL_SEC:-0.08}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8001"
      API_GATEWAY_URL: http://api-gateway:8000
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8001/health', timeout=5) or sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # Heaviest I/O fan-out service (AngelOne + yfinance + NSE waterfall) —
    # give it the largest CPU share of the six.
    cpus: "0.55"
    mem_limit: 1200m
    mem_reservation: 500m

  analysis-intelligence-service:
    build: ./services/analysis-intelligence-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      MARKET_DATA_URL: http://market-data-service:8001
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8000"
      PEER_FUNDAMENTALS_CACHE_TTL_SECONDS: ${PEER_FUNDAMENTALS_CACHE_TTL_SECONDS:-60}
      PEER_FUNDAMENTALS_FETCH_WORKERS: ${PEER_FUNDAMENTALS_FETCH_WORKERS:-6}
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - market-data-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5) or sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    cpus: "0.45"
    mem_limit: 900m
    mem_reservation: 350m

  decision-prediction-service:
    build: ./services/decision-prediction-service
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      MARKET_DATA_URL: http://market-data-service:8001
      TECHNICAL_URL: http://analysis-intelligence-service:8000/technical
      FUNDAMENTAL_URL: http://analysis-intelligence-service:8000/fundamental
      NEWS_URL: http://analysis-intelligence-service:8000/news
      EVENT_URL: http://analysis-intelligence-service:8000/event
      PREDICTION_URL: http://decision-prediction-service:8000/prediction
      TRAINING_SERVICE_URL: http://decision-prediction-service:8000/training
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      TRAINING_DATABASE_URL: ${TRAINING_DATABASE_URL:-${DATABASE_URL:-}}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8000"
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - market-data-service
      - analysis-intelligence-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5) or sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # sklearn training bursts need more headroom than its steady-state CPU
    # use — mem_limit stays large on purpose. cpus trimmed slightly
    # (2026-09-03) to make room for real-trade-service's priority bump.
    cpus: "0.40"
    mem_limit: 1600m
    mem_reservation: 400m

  notification-scheduler-service:
    build: ./services/notification-scheduler-service
    ports:
      - "8008:8000"
    env_file:
      - .env
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-}
      USE_REDIS: ${USE_REDIS:-0}
      PORT: "8000"
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5) or sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # Mostly idle, timer-driven — smallest share.
    cpus: "0.15"
    mem_limit: 350m
    mem_reservation: 128m

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MARKET_DATA_URL: http://market-data-service:8001
      TECHNICAL_URL: http://analysis-intelligence-service:8000/technical
      FUNDAMENTAL_URL: http://analysis-intelligence-service:8000/fundamental
      NEWS_URL: http://analysis-intelligence-service:8000/news
      EVENT_URL: http://analysis-intelligence-service:8000/event
      MARKET_SENTIMENT_URL: http://analysis-intelligence-service:8000/sentiment
      DECISION_URL: http://decision-prediction-service:8000/decision
      PREDICTION_URL: http://decision-prediction-service:8000/prediction
      TRAINING_URL: http://decision-prediction-service:8000/training
      NOTIFICATION_URL: http://notification-scheduler-service:8000/notification
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-}
      TRAINING_DATABASE_URL: ${TRAINING_DATABASE_URL:-${DATABASE_URL:-}}
      USE_REDIS: ${USE_REDIS:-0}
      DISABLE_UPSTASH: ${DISABLE_UPSTASH:-1}
      PORT: "8000"
      WATCHLIST_SCAN_CONCURRENCY: ${WATCHLIST_SCAN_CONCURRENCY:-4}
      WATCHLIST_SCAN_HTTP_CONCURRENCY: ${WATCHLIST_SCAN_HTTP_CONCURRENCY:-8}
      WATCHLIST_SCAN_TIMEOUT_SECONDS: ${WATCHLIST_SCAN_TIMEOUT_SECONDS:-18}
      WATCHLIST_SCAN_GRACE_SECONDS: ${WATCHLIST_SCAN_GRACE_SECONDS:-30}
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    depends_on:
      - market-data-service
      - analysis-intelligence-service
      - decision-prediction-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5) or sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # Pure async I/O fan-out/proxy — CPU-light, but every request passes
    # through it, so it still gets a solid share.
    cpus: "0.45"
    mem_limit: 500m
    mem_reservation: 200m

  real-trade-service:
    build: ./services/real-trade-service
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      MARKET_DATA_URL: http://market-data-service:8001
      EVENT_URL: http://analysis-intelligence-service:8000/event
      NOTIFICATION_SERVICE_URL: http://notification-scheduler-service:8000/notification
      PORT: "8005"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DHAN_CREDENTIAL_ENC_KEY: ${DHAN_CREDENTIAL_ENC_KEY:-}
      DHAN_ENV: ${DHAN_ENV:-sandbox}
      DHAN_TOTP_ENABLED: ${DHAN_TOTP_ENABLED:-false}
      DHAN_TOKEN_LIFETIME_DAYS: ${DHAN_TOKEN_LIFETIME_DAYS:-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AUTO_PILOT_INTERVAL_SECONDS: ${AUTO_PILOT_INTERVAL_SECONDS:-180}
      AUTO_PILOT_NOTIFY_HEARTBEAT: ${AUTO_PILOT_NOTIFY_HEARTBEAT:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
      ORACLE_WALLET_DIR: /oracle_wallet
      TNS_ADMIN: /oracle_wallet
    volumes:
      - ${ORACLE_WALLET_HOST_DIR:-./oracle_wallet}:/oracle_wallet:ro
    # depends_on intentionally removed (2026-09-03 durability upgrade):
    # real-trade-service must start on VM reboot without waiting on the rest
    # of the stack. It handles unreachable dependencies at runtime via
    # circuit_breaker.py + the Tier 1/2/3 degradation ladder, not via
    # startup ordering.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8005/health', timeout=5) or sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    # Highest priority in the stack (2026-09-03 durability upgrade): this is
    # the only service placing real orders, so it now gets the largest
    # cpu/mem share on the box, trimmed from market-data-service and
    # decision-prediction-service below.
    cpus: "0.70"
    mem_limit: 1000m
    mem_reservation: 400m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "5173:8080"
    depends_on:
      - api-gateway
    restart: unless-stopped
    logging: *default-logging
    cpus: "0.10"
    mem_limit: 96m
    mem_reservation: 32m

# Total caps: cpus sum ≈ 2.55 (soft ceilings, not reservations — fine to
# slightly exceed 2 vCPU since these are mostly I/O-bound and never all
# peak at once); mem_limit sum ≈ 5.1 GB, leaving ~7 GB free for the OS,
# Docker, the Oracle wallet's TLS buffers, and a safety margin against OOM.
