# Runs INSIDE the frontend container, serving the built Vite bundle on 8080.
# The host nginx (deploy/nginx-stockky.conf) reverse-proxies to this port.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 2026-10-05 (group 149): don't advertise the nginx version.
    server_tokens off;

    # Dotfiles / VCS / secrets (.env, .git, .aws, .vscode ...) are never part
    # of the bundle. Without this the SPA fallback below answered scanners'
    # GET /.env with 200 + index.html (harmless content, but it looked like a
    # leak and polluted the logs).
    location ~ /\. {
        return 404;
    }

    # Server-side script / config / backup extensions are never served by this
    # container either. Real files (none expected) would still be found by
    # try_files; everything else is a clean 404 instead of index.html.
    location ~* \.(?:php[0-9]?|phtml|asp|aspx|jsp|cgi|env|ya?ml|json|ini|conf|cfg|toml|bak|old|orig|sql|log|txt|xml|zip|gz|tar|sh)$ {
        try_files $uri =404;
    }

    # group346 (log review #19): scanners probing /metrics, /employee-home.html etc. fell through to the SPA page (200).
    # Operational endpoints that this container does not serve, and stray .html files other than index.html, get a clean 404.
    location ~* ^/(?:metrics|actuator|server-status|server-info|phpinfo|wp-admin|wp-login|wp-content|wp-includes|cgi-bin|vendor|solr|console|manager)(?:/|$) {
        return 404;
    }
    location ~* \.html?$ {
        try_files $uri =404;
    }

    # Compress text-based responses — cuts JS/CSS bundle transfer size
    # substantially on the first load of every session.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml font/woff2;
    gzip_vary on;

    # Vite's production build hashes filenames (e.g. index-a1b2c3d4.js), so
    # these are safe to cache "forever" — a new deploy ships a new filename,
    # never a stale one under an old URL.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must NEVER be cached — it's what points at the
    # current hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # group 443: Real Money Calibration runner. The host nginx normally proxies /calibration/ (deploy/nginx-stockky.conf); when that block was not
    # installed, the request fell through to the SPA fallback below and the page got index.html instead of JSON (blank page). This block makes the
    # frontend container answer it itself. `^~` so the regex locations above (.json / .txt / .zip) do not swallow run downloads. A variable +
    # resolver keeps nginx starting even while the runner container is down (it then answers 502 instead of failing to boot).
    location ^~ /calibration/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $calibration_runner http://calibration-runner-service:8012;
        rewrite ^/calibration/(.*)$ /$1 break;
        proxy_pass $calibration_runner;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
