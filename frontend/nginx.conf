# Runs INSIDE the frontend container, serving the built Vite bundle on 8080.
# The host nginx (deploy/nginx-stockky.conf) reverse-proxies to this port.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses — cuts JS/CSS bundle transfer size
    # substantially on the first load of every session.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml font/woff2;
    gzip_vary on;

    # Vite's production build hashes filenames (e.g. index-a1b2c3d4.js), so
    # these are safe to cache "forever" — a new deploy ships a new filename,
    # never a stale one under an old URL.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must NEVER be cached — it's what points at the
    # current hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
