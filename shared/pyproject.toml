# F33 part 3 (E50): the market-structure engine as ONE installable package.
#   pip install ./shared            # -> `import stockky_ms` (the same name the per-service vendored copies use)
#   pip wheel ./shared -w dist/     # build a wheel
# Source of truth stays shared/market_structure/ (edit only there). The per-service `stockky_ms/` copies are still generated by
# scripts/sync_market_structure.py because each Docker image is built from its own service folder. scripts/check_ms_package.py (CI)
# fails when this file and the real folder disagree. Pure standard library: no dependencies.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockky-ms"
version = "1.0.0"
description = "Stockky market-structure engine (swings, levels, patterns, scoring) - standard library only"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["stockky_ms"]

[tool.setuptools.package-dir]
stockky_ms = "market_structure"
