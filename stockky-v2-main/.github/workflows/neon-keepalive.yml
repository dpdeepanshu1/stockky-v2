# Ping Neon via api-gateway every 4 minutes during market hours (IST).
# Prevents free-tier compute auto-suspend (~5 min idle) so scans avoid cold-start lag.
#
# Secret required: API_GATEWAY_URL
name: Neon Keep-Alive

on:
  schedule:
    # Every 4 min during UTC hours covering IST market window
    - cron: "*/4 3-11 * * 1-5"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Neon keepalive (market hours IST)
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL:-}"
          if [ -z "$GW" ]; then
            echo "API_GATEWAY_URL secret is not set — skip"
            exit 0
          fi
          GW="${GW%/}"

          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$(TZ=Asia/Kolkata date +%H%M)
          NOW=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')
          echo "IST now: $NOW DOW=$DOW HM=$HM"

          # Mon–Fri 08:00–16:30 IST (slightly wider than market to cover pre/post)
          if [ "$DOW" -gt 5 ] || [ "$HM" -lt 0800 ] || [ "$HM" -gt 1630 ]; then
            echo "Outside keep-alive window — skip"
            exit 0
          fi

          code=$(curl -sS -o /tmp/neon_ka.json -w "%{http_code}" \
            -X POST "$GW/ops/neon-keepalive" \
            --max-time 20 || echo "000")
          echo "HTTP $code"
          cat /tmp/neon_ka.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "Keep-alive failed (non-fatal)"
            exit 0
          fi
