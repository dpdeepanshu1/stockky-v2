# Retrain prediction model — after IST midnight (Asia/Kolkata).
# 00:30 IST = 19:00 UTC previous calendar day.
name: Retrain Prediction Model

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: IST log
        run: |
          echo "IST now: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M %Z')"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/decision-prediction-service/prediction
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wake up backend services (optional)
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
        run: |
          set +e
          if [ -n "$API_GATEWAY_URL" ]; then
            curl -s -o /dev/null -w "%{http_code}" "$API_GATEWAY_URL/health" || true
          fi
          if [ -n "$MARKET_DATA_URL" ]; then
            curl -s -o /dev/null -w "%{http_code}" "$MARKET_DATA_URL/health" || true
          fi
          sleep 10

      - name: Retrain model
        working-directory: services/decision-prediction-service/prediction
        run: |
          python pred_train.py
          mkdir -p ../../../data/prediction-model
          cp model.pkl ../../../data/prediction-model/model.pkl

      - name: Commit and push updated model
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/prediction-model/model.pkl || true
          if git diff --staged --quiet; then
            echo "No changes to model"
          else
            git commit -m "Auto-retrain prediction model [skip ci]"
            git push
          fi
