# Pre-market surprise baselines → Neon surprise_static_feed (~08:55 IST).
# GitHub cron is UTC: 08:55 IST ≈ 03:25 UTC.
#
# Secrets: MARKET_DATA_URL (preferred) or API_GATEWAY_URL
name: Surprise Premarket Baselines

on:
  schedule:
    - cron: "25 3 * * 1-5"
  workflow_dispatch:

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run surprise premarket job
        env:
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          set +e
          MD="${MARKET_DATA_URL:-}"
          GW="${API_GATEWAY_URL:-}"
          MD="${MD%/}"
          GW="${GW%/}"

          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$(TZ=Asia/Kolkata date +%H%M)
          NOW=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')
          echo "IST now: $NOW DOW=$DOW HM=$HM"

          if [ "$DOW" -gt 5 ]; then
            echo "Weekend — skip"
            exit 0
          fi

          # Prefer API gateway so scan universe is injected automatically
          TARGET=""
          if [ -n "$GW" ]; then
            TARGET="$GW/surprise/premarket"
          elif [ -n "$MD" ]; then
            TARGET="$MD/surprise/premarket"
          else
            echo "No API_GATEWAY_URL or MARKET_DATA_URL secret — skip"
            exit 0
          fi

          echo "POST $TARGET (gateway injects scan universe when body has no symbols)"
          code=$(curl -sS -o /tmp/surprise_pm.json -w "%{http_code}" \
            -X POST "$TARGET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 1200 || echo "000")
          echo "HTTP $code"
          cat /tmp/surprise_pm.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "Premarket job non-200 (non-fatal for workflow)"
            exit 0
          fi
