# Keep free-tier Render services warm — ONLY on NSE market days + market window (IST Asia/Kolkata).
# Outside Mon–Fri 08:30–16:00 IST this workflow does NOTHING (manual Wake / UI session keepalive cover the rest).
#
# GitHub cron is UTC:
#   IST 08:30 ≈ UTC 03:00, IST 16:00 ≈ UTC 10:30
# Job always re-checks TZ=Asia/Kolkata before any curl.
#
# Secrets: API_GATEWAY_URL (required). Optional: NOTIFICATION_URL, MARKET_DATA_URL,
# ANALYSIS_INTELLIGENCE_URL, DECISION_PREDICTION_URL
name: Stockky Keep-Warm

on:
  schedule:
    # Every 5 min during UTC hours that cover IST market — gate still re-checks IST
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "force_full | force_light | auto"
        required: false
        default: "auto"

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake services (market-hours only, IST)
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          ANALYSIS_URL: ${{ secrets.ANALYSIS_INTELLIGENCE_URL }}
          DECISION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
          FORCE_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          set +e
          GW="${API_GATEWAY_URL:-}"
          if [ -z "$GW" ]; then
            echo "API_GATEWAY_URL secret is not set — skip"
            exit 0
          fi
          GW="${GW%/}"

          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$(TZ=Asia/Kolkata date +%H%M)
          NOW=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')
          MODE="${FORCE_MODE:-auto}"
          echo "IST now: $NOW DOW=$DOW HM=$HM MODE=$MODE"

          is_market_session=0
          if [ "$DOW" -le 5 ] && [ "$HM" -ge 0830 ] && [ "$HM" -le 1600 ]; then
            is_market_session=1
          fi

          if [ "$MODE" = "force_full" ]; then
            is_market_session=1
          elif [ "$MODE" = "force_light" ]; then
            is_market_session=0
          fi

          if [ "$is_market_session" -eq 0 ]; then
            echo "=== SKIP keep-warm (outside IST market window / weekend) ==="
            # Ultra-light gateway ping only if force_light — still avoids deep fan-out
            if [ "$MODE" = "force_light" ]; then
              curl -fsS -m 15 "$GW/ops/keepalive" || curl -fsS -m 15 "$GW/health" || true
            fi
            exit 0
          fi

          echo "=== FULL warm (IST market window) ==="
          curl -fsS -m 45 -X POST "$GW/wake-all" || curl -fsS -m 45 "$GW/wake-all" || true
          curl -fsS -m 25 "$GW/health?warm=true" || true
          curl -fsS -m 15 "$GW/ops/keepalive" || true

          for U in "$MARKET_DATA_URL" "$ANALYSIS_URL" "$DECISION_URL" "$NOTIFICATION_URL"; do
            if [ -n "$U" ]; then
              BASE="${U%/}"
              echo "Warm ping $BASE"
              curl -fsS -m 20 "$BASE/health?warm=true" || curl -fsS -m 20 "$BASE/health" || true
            fi
          done

          NOTIF="${NOTIFICATION_URL:-}"
          if [ -n "$NOTIF" ]; then
            N="${NOTIF%/}"
            curl -fsS -m 30 -X POST "$N/outbox/process" || curl -fsS -m 30 -X POST "$N/notification/outbox/process" || true
          else
            curl -fsS -m 30 -X POST "$GW/notification/outbox/process" || true
          fi

          curl -fsS -m 25 -X POST "$GW/ops/check-alert" || true
          echo "Full warm done"
