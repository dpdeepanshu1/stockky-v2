name: Stockky Hot Picks (Midnight IST)

# ~00:30 IST (19:00 UTC previous day) Sun–Thu UTC → Mon–Fri IST early hours
# Pattern mirrors data-feed-midnight: wake services, start job, poll status,
# re-warm between polls so free-tier dynos do not sleep mid-batch.
on:
  schedule:
    - cron: "0 19 * * 0-4"
  workflow_dispatch:

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: IST check
        run: echo "IST $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"

      - name: Batched Hot Picks + keep-warm between polls
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          ANALYSIS_URL: ${{ secrets.ANALYSIS_INTELLIGENCE_URL }}
          DECISION_URL: ${{ secrets.DECISION_PREDICTION_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
        run: |
          set +e
          GW="${API_GATEWAY_URL%/}"
          [ -n "$GW" ] || { echo "API_GATEWAY_URL missing"; exit 1; }

          warm() {
            echo "=== warm $(TZ=Asia/Kolkata date '+%H:%M:%S IST') ==="
            curl -sS -m 30 -X POST "$GW/wake-all" >/dev/null 2>&1 || true
            curl -sS -m 25 "$GW/wake-all" >/dev/null 2>&1 || true
            curl -sS -m 20 "$GW/health?warm=true" >/dev/null 2>&1 || true
            curl -sS -m 12 "$GW/ops/keepalive" >/dev/null 2>&1 || true
            curl -sS -m 12 "$GW/ops/keepalive?deep=true" >/dev/null 2>&1 || true
            for U in "$MARKET_DATA_URL" "$ANALYSIS_URL" "$DECISION_URL" "$NOTIFICATION_URL"; do
              [ -z "$U" ] && continue
              BASE="${U%/}"
              curl -sS -m 15 "$BASE/health?warm=true" >/dev/null 2>&1 || \
                curl -sS -m 12 "$BASE/health" >/dev/null 2>&1 || true
            done
          }

          # Double warm before start (cold free-tier dynos)
          warm
          sleep 15
          warm
          sleep 10

          echo "=== start Hot Picks (force) ==="
          # Short timeout on start only — job runs in background on gateway
          curl -sS -m 60 -X POST "$GW/stockky-hot/run?force=true" || \
            curl -sS -m 45 -X POST "$GW/stockky-hot/run?force=true" || true
          sleep 5

          # Poll up to ~100 min (200 * 30s); re-warm every other poll
          for i in $(seq 1 200); do
            sleep 30
            if [ $((i % 2)) -eq 0 ]; then
              warm
            fi

            ST=$(curl -sS -m 45 "$GW/stockky-hot/status" 2>/dev/null || echo '{}')
            echo "[$i] $ST" | head -c 400
            echo

            echo "$ST" | grep -q '"status":"done"' && {
              echo "Hot Picks done"
              curl -sS -m 30 "$GW/stockky-hot/result" 2>/dev/null | head -c 500
              echo
              exit 0
            }
            echo "$ST" | grep -q '"status":"error"' && {
              echo "Hot Picks error"
              exit 1
            }
            # still running / idle after start — keep waiting
          done

          echo "Timeout — check gateway /stockky-hot/status; result may still finish on server"
          # Soft-fail: if any cached result exists, treat as partial success
          RES=$(curl -sS -m 30 "$GW/stockky-hot/status" 2>/dev/null || echo '{}')
          echo "$RES" | grep -q '"has_result":true' && {
            echo "has_result=true — accepting partial/cached success"
            exit 0
          }
          exit 1
